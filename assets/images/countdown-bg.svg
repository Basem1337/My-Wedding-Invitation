<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1514"/>
      <stop offset="50%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#151010"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#mood)"/>
  <!-- soft figurative shapes suggesting a couple silhouette -->
  <g filter="url(#softBlur)" opacity="0.55">
    <ellipse cx="720" cy="420" rx="90" ry="120" fill="#6a5e5a"/>
    <ellipse cx="880" cy="400" rx="100" ry="140" fill="#8a7e78"/>
    <ellipse cx="800" cy="560" rx="220" ry="160" fill="#4a403c"/>
    <ellipse cx="400" cy="700" rx="300" ry="120" fill="#2a2422"/>
    <ellipse cx="1200" cy="680" rx="280" ry="140" fill="#2e2826"/>
  </g>
  <g opacity="0.2" fill="#cfc6be">
    <circle cx="300" cy="200" r="80"/>
    <circle cx="1300" cy="180" r="100"/>
    <circle cx="900" cy="120" r="50"/>
  </g>
</svg>
